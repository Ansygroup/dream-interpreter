# Auto-deploy Dreamscope to Vercel production on every push to master.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — from .vercel/project.json ("orgId")
#   VERCEL_PROJECT_ID  — from .vercel/project.json ("projectId")
# إذا لم تكن الأسرار مضبوطة، يتخطى ال workflow برسالة واضحة بدل الفشل اليومي.
name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          HAS_TOKEN="${{ secrets.VERCEL_TOKEN }}"
          HAS_ORG="${{ secrets.VERCEL_ORG_ID }}"
          HAS_PROJ="${{ secrets.VERCEL_PROJECT_ID }}"
          if [ -z "$HAS_TOKEN" ] || [ -z "$HAS_ORG" ] || [ -z "$HAS_PROJ" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  أسرار Vercel غير مضبوطة (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID) — تخطي النشر."
            echo "    أضفها من Settings → Secrets and variables → Actions ثم أعد التشغيل."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ الأسرار موجودة — متابعة النشر."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
